services:
  api:
    build:
      context: ..
      dockerfile: config/Dockerfile
    expose:
      - "8000"
    environment:
      MODEL_DIR: /models/qwen3-4b-instruct-2507-onnx-int4
    volumes:
      - ../models/qwen3-4b-instruct-2507-onnx-int4:/models/qwen3-4b-instruct-2507-onnx-int4:ro

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  prometheus_data:
